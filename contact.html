<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>


  <body>
<script src='header.js'> </script>

  <section id="contact" class="contact">
      <div class="container contact-inner">
        <div class="contact-copy">
      <p>   
      </p>
          <h2>Contact Us</h2>
          <p>
            If you have any questions or would like to get in touch with us, please fill out the form below and we will get back to you as soon as possible.
          </p>
          <form action="#" method="post" class="contact-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            <a href="mailto:ajbalet@icloud.com" class="button">Send Message</a>
          </form>
        </div>
        <div class="contact-visual" aria-label="Contact Visual">
          <img src="images/contact_visual.png" alt="Thanks for your input!" />
        </div>
      </div>

    </section>
    <script src='footer.js'></script>

    </body>
      <script src="script.js"></script>
    </html>
